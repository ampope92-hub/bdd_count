name = "bdd-count"

# The one path the separate verifier collects from the agent's final container. A top-level key
# on purpose: Harbor ignores an artifacts list placed under [verifier].
artifacts = [
    "/app/bdd/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Hardware"
subcategory = "RTL"
tags = ["d", "bdd", "model-counting", "gate-level", "eco", "tcp"]
languages = ["d"]
difficulty = "advanced"
expert_time_estimate_hours = 6
is_multi_container = true
difficulty_explanation = """
Counting the satisfying assignments of a Boolean function is #P-hard, and the blocks here are ordinary data path logic, which is exactly where the choice of method decides whether the count finishes at all. The shipped block has 20 inputs, so a truth table over all 2^20 assignments, a BDD in port-list order and a BDD in name order all give the right counts in under a second and nothing on it separates them. The README states the size the flow signs off (up to 256 inputs and 4096 gates) and says the blocks are adders, comparators and encoders, and the held-back block is a 56-bit ALU slice with a 40-bit comparator, 212 inputs and 2036 gates. There enumeration needs 2^206 passes and is killed at 90 seconds, and a BDD whose variables follow the port list or sorted names puts every bit of one operand ahead of the other, so the adder's BDD grows exponentially and the run exhausts its 4 GiB of address space after 11 to 33 seconds on each of 8 generated blocks. A variable order read from the circuit, with bits that meet in one cell kept together, holds the same block at about 114,000 nodes and finishes in two to three seconds. Knowing that variable order is the whole cost of a BDD on arithmetic, and testing against the stated bound rather than the block at hand, is the expert judgment. A second axis interacts with it: the block is re-counted at every checkpoint revision, where each net and output takes the ECO line of the highest revision at or below the checkpoint although the change database lists lines out of revision order, an output can be dropped and added back, and inputs no gate reads still double the count. Applying the lines in page order or all at once gives wrong counts on both blocks. The data is generated by solution/generate_block.py; the net lists are synthetic but follow what a mapper writes: scrambled port and cell order, synthesis-numbered nets, and gate forms varied the way a technology mapper varies them.
"""
solution_explanation = """
solution/bddcount.d reads the greeting, fetches every net list and ECO page over TCP, sleeps out BUSY answers and reconnects after BYE limit. For each checkpoint it rebuilds the circuit: the ECO lines at or below the checkpoint are sorted stably by revision and applied on top of the base net list, a GATE line replacing or adding a driver, an OUTPUT line adding or re-driving an output and a DROP line removing it. It then orders the BDD variables from that circuit: outputs from the smallest fan-in cone to the largest, each walked depth first through its gates' inputs, a primary input taking the next level the first time the walk reaches it, and inputs nothing reads placed last. Every output becomes a reduced ordered BDD in one shared manager with a hashed unique table and an ITE computed table, and its count is taken with Phobos arbitrary-precision integers by scaling each child's count by two to the number of levels it skips and the root's by the levels above it. On the held-back block this takes two to three seconds and under 40 MB of resident memory; the shipped block takes under a second, most of it spent waiting out BUSY answers.
"""
verification_explanation = """
Grading runs in a separate container that keeps only the regular .d files directly in /app/bdd/src, compiles them as an unprivileged user with the same ldc2 1.41.0 (std.numeric removed) and interpreters closed during the build. Its own copy of the export server then serves the shipped block on 127.0.0.3:7521 (limit 4 commands, BUSY every third) and the held-back block, which never exists in the agent's container, on 127.0.0.5:7634 (limit 6, BUSY every fifth). Each run starts from /app/bdd with a clean environment, 4 GiB of address space set by root with prlimit before the drop to the runner, a seccomp launcher that refuses every exec after its own, and a KILL at 90 seconds; the wall time is recorded so a run only counts as timed out when it reached the limit. tests/test_outputs.py checks that the build succeeded and, for each block, that every (checkpoint, output) pair present in the generator's exact counts is reported once and none that is absent is, and that every count is the exact decimal the generator computed with its own BDD package (cross-checked by a full truth table on the shipped block). The expected counts, the blocks and the server sit under root-only directories that the verifier proves the runner cannot list before any candidate code runs. Arms run through the real verifier: the reference passes; with the BDD in port-list order, name order or fan-out order it passes the shipped block and dies with an out-of-memory error on the held-back one; enumeration passes the shipped block and is killed at 90 seconds; ECO lines in page order, every ECO line at every checkpoint, tie-off inputs left out of the count, a root count not scaled by the levels above it, the shipped counts pasted into the source, a literal 127.0.0.1 and a BUSY answer treated as fatal each fail on both blocks or the held-back one.
"""
relevant_experience = """
Logic synthesis or formal verification work with binary decision diagrams (variable ordering, unique and computed tables, model counting), gate-level net lists and ECO flows, plus systems programming in D against a small TCP line protocol.
"""

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "public"

[agent]
timeout_sec = 5400
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = 1200
cpus = 2
memory_mb = 8192
storage_mb = 10240
